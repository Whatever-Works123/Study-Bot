<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyBox</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <button class="mobile-toggle" onclick="toggleSidebar()">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
    </button>

    <div class="sidebar" id="sidebar">
        <div class="logo">
            <h2>✨ StudyBot</h2>
        </div>
        <nav>
            <div class="nav-link active" onclick="showPage('home')"><span>🏠</span> Dashboard</div>
            <div class="nav-link" onclick="showPage('timer')"><span>⏳</span> Focus Timer</div>
            <div class="nav-link" onclick="showPage('todo')"><span>✅</span> Tasks</div>
            <div class="nav-link" onclick="showPage('notes')"><span>📝</span> Notes</div>
            <div style="margin-top: auto; border-top: 1px solid rgba(0,0,0,0.05); padding-top: 20px;">
                <div class="nav-link" onclick="showPage('settings')"><span>⚙️</span> Settings</div>
            </div>
        </nav>
    </div>

    <div class="main-content">
        <div id="home" class="page active">
            <h1>Hello, Student! 👋</h1>
            <div class="stats-grid">
                <div class="card">
                    <div class="stat-number" id="stat-notes">0</div>
                    <p style="color: var(--text-secondary); font-weight: 500;">Knowledge Base</p>
                </div>
                <div class="card">
                    <div class="stat-number" id="stat-todos">0</div>
                    <p style="color: var(--text-secondary); font-weight: 500;">Pending Tasks</p>
                </div>
                <div class="card">
                    <div class="stat-number" id="stat-pomodoros">0</div>
                    <p style="color: var(--text-secondary); font-weight: 500;">Focus Sessions</p>
                </div>
            </div>
            
            <h3 style="margin: 40px 0 20px; font-weight: 600;">🚀 Up Next</h3>
            <div id="upcoming-tasks">
                </div>
        </div>

        <div id="timer" class="page">
            <h1 style="text-align: center;">Focus Zone</h1>
            <div class="card" style="text-align: center; max-width: 600px; margin: 0 auto; padding: 50px;">
                <div class="timer-modes">
                    <button class="mode-btn active" onclick="setTimerMode(25)">Focus Flow</button>
                    <button class="mode-btn" onclick="setTimerMode(5)">Short Break</button>
                    <button class="mode-btn" onclick="setTimerMode(15)">Deep Rest</button>
                </div>
                <div class="timer-display" id="timer-display">25:00</div>
                <div style="display: flex; gap: 15px; justify-content: center;">
                    <button class="btn" id="start-btn" onclick="startTimer()" style="padding: 15px 40px; font-size: 1.2rem;">Start Focus</button>
                    <button class="btn btn-outline" onclick="resetTimer()">Reset</button>
                </div>
            </div>
        </div>

        <div id="todo" class="page">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
                <h1>My Tasks</h1>
                <button class="btn" onclick="openTodoModal()">
                    <span style="font-size: 1.2rem;">+</span> New Task
                </button>
            </div>
            <div id="todo-list" style="display: flex; flex-direction: column; gap: 15px;"></div>
        </div>

        <div id="notes" class="page">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
                <h1>My Notes</h1>
                <button class="btn" onclick="openNoteModal()">
                    <span style="font-size: 1.2rem;">+</span> Create Note
                </button>
            </div>
            <input type="text" id="note-search" placeholder="🔍 Search your notes..." oninput="renderNotes()">
            <div class="notes-grid" id="notes-grid"></div>
        </div>

        <div id="settings" class="page">
            <h1>Preferences</h1>
            <div class="card">
                <div style="display: flex; justify-content: space-between; align-items: center; padding: 10px 0;">
                    <div>
                        <h3 style="margin-bottom: 5px;">Dark Mode</h3>
                        <p style="color: var(--text-secondary); font-size: 0.9rem;">Switch to a darker theme for night study.</p>
                    </div>
                    <label class="switch">
                        <input type="checkbox" id="dark-mode-toggle" onchange="toggleDarkMode()">
                        <span class="slider"></span>
                    </label>
                </div>
                <hr style="margin: 30px 0; border: 0; border-top: 1px solid var(--border-color); opacity: 0.2;">
                <button class="btn" style="background: var(--danger); box-shadow: 0 4px 15px rgba(239, 68, 68, 0.3);" onclick="clearAllData()">⚠️ Reset All Data</button>
            </div>
        </div>
    </div>

    <div id="todo-modal" class="modal" style="display: none;">
        <div class="modal-content">
            <h2 style="margin-bottom: 25px;">Add New Task</h2>
            <div style="display: flex; flex-direction: column; gap: 5px;">
                <label style="font-size: 0.85rem; font-weight: 600; color: var(--text-secondary);">WHAT NEEDS TO BE DONE?</label>
                <input type="text" id="modal-todo-text" placeholder="e.g., Complete Chapter 4 Review">
            </div>
            
            <div style="display: flex; flex-direction: column; gap: 5px; margin-top: 15px;">
                <label style="font-size: 0.85rem; font-weight: 600; color: var(--text-secondary);">DETAILS (OPTIONAL)</label>
                <textarea id="modal-todo-desc" placeholder="Add specific details or subtasks..." rows="3"></textarea>
            </div>

            <div style="display: flex; gap: 20px; margin-top: 15px;">
                <div style="flex: 1;">
                    <label style="font-size: 0.85rem; font-weight: 600; color: var(--text-secondary);">DUE DATE</label>
                    <input type="date" id="modal-todo-date">
                </div>
                <div style="flex: 1;">
                    <label style="font-size: 0.85rem; font-weight: 600; color: var(--text-secondary);">PRIORITY</label>
                    <select id="modal-todo-priority">
                        <option value="low">Low Priority</option>
                        <option value="medium" selected>Medium</option>
                        <option value="high">High Priority</option>
                    </select>
                </div>
            </div>

            <div style="display: flex; gap: 15px; margin-top: 30px; justify-content: flex-end;">
                <button class="btn btn-outline" onclick="closeTodoModal()">Cancel</button>
                <button class="btn" onclick="saveTodoFromModal()">Save Task</button>
            </div>
        </div>
    </div>

    <div id="note-modal" class="modal" style="display: none;">
        <div class="modal-content">
            <h2 id="modal-title" style="margin-bottom: 25px;">Edit Note</h2>
            <input type="text" id="note-title" placeholder="Note Title" style="font-weight: 700; font-size: 1.1rem;">
            <textarea id="note-content" placeholder="Start typing your thoughts..." rows="8"></textarea>
            <input type="text" id="note-tags" placeholder="🏷️ Tags (separated by comma)">
            
            <div style="background: rgba(0,0,0,0.03); padding: 15px; border-radius: 12px; margin-top: 10px;">
                <label style="display: block; font-weight: 500; margin-bottom: 8px; font-size: 0.9rem;">Attach Image</label>
                <input type="file" id="note-image" accept="image/*" style="padding: 10px; background: white;">
                <div id="image-preview" style="margin-top: 10px; border-radius: 8px; overflow: hidden;"></div>
            </div>
            
            <div style="display: flex; gap: 15px; margin-top: 25px; justify-content: flex-end;">
                <button class="btn btn-outline" onclick="closeNoteModal()">Cancel</button>
                <button class="btn" onclick="saveNote()">Save Note</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
