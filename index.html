<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyBox OS</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <button class="mobile-toggle" onclick="toggleSidebar()">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
    </button>

    <div class="sidebar" id="sidebar">
        <div class="logo">
            <h2>✨ StudyBot</h2>
        </div>
        <nav>
            <div class="nav-link active" onclick="showPage('home')"><span>🏠</span> Dashboard</div>
            <div class="nav-link" onclick="showPage('timer')"><span>⏳</span> Focus Timer</div>
            <div class="nav-link" onclick="showPage('todo')"><span>✅</span> Tasks</div>
            <div class="nav-link" onclick="showPage('notes')"><span>📝</span> Notes</div>
            <div style="margin-top: auto; border-top: 1px solid rgba(0,0,0,0.05); padding-top: 20px;">
                <div class="nav-link" onclick="showPage('settings')"><span>⚙️</span> Settings</div>
            </div>
        </nav>
    </div>

    <div class="main-content">
        <div id="home" class="page active">
            <h1 class="fade-in">Hello, Student! 👋</h1>
            <div class="stats-grid fade-in" style="animation-delay: 0.1s;">
                <div class="card">
                    <div class="stat-number" id="stat-notes">0</div>
                    <p style="color: var(--text-secondary); font-weight: 500;">Knowledge Base</p>
                </div>
                <div class="card">
                    <div class="stat-number" id="stat-todos">0</div>
                    <p style="color: var(--text-secondary); font-weight: 500;">Pending Tasks</p>
                </div>
                <div class="card">
                    <div class="stat-number" id="stat-pomodoros">0</div>
                    <p style="color: var(--text-secondary); font-weight: 500;">Focus Sessions</p>
                </div>
            </div>
            
            <h3 class="fade-in" style="margin: 40px 0 20px; font-weight: 600; animation-delay: 0.2s;">🚀 Up Next</h3>
            <div id="upcoming-tasks" class="fade-in" style="animation-delay: 0.3s;"></div>
        </div>

        <div id="timer" class="page">
            <h1 style="text-align: center;">Focus Zone</h1>
            <div class="card" style="text-align: center; max-width: 600px; margin: 0 auto; padding: 50px;">
                <div class="timer-modes">
                    <button class="mode-btn active" onclick="setTimerMode(25)">Focus Flow</button>
                    <button class="mode-btn" onclick="setTimerMode(5)">Short Break</button>
                    <button class="mode-btn" onclick="setTimerMode(15)">Deep Rest</button>
                </div>
                <div class="timer-display" id="timer-display">25:00</div>
                <div style="display: flex; gap: 15px; justify-content: center;">
                    <button class="btn" id="start-btn" onclick="startTimer()" style="padding: 15px 40px; font-size: 1.2rem;">Start Focus</button>
                    <button class="btn btn-outline" onclick="resetTimer()">Reset</button>
                </div>
            </div>
        </div>

        <div id="todo" class="page">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
                <h1>My Tasks</h1>
                <button class="btn" onclick="openTodoModal()">
                    <span style="font-size: 1.2rem; margin-right: 8px;">+</span> New Task
                </button>
            </div>
            <div id="todo-list" style="display: flex; flex-direction: column; gap: 15px;"></div>
        </div>

        <div id="notes" class="page">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
                <h1>My Notes</h1>
                <button class="btn" onclick="openNoteModal()">
                    <span style="font-size: 1.2rem; margin-right: 8px;">+</span> Create Note
                </button>
            </div>
            <input type="text" id="note-search" placeholder="🔍 Search your notes..." oninput="renderNotes()">
            <div class="notes-grid" id="notes-grid"></div>
        </div>

        <div id="settings" class="page">
            <h1>Preferences</h1>
            <div class="card">
                <div style="display: flex; justify-content: space-between; align-items: center; padding: 10px 0;">
                    <div>
                        <h3 style="margin-bottom: 5px;">Dark Mode</h3>
                        <p style="color: var(--text-secondary); font-size: 0.9rem;">Switch to a darker theme for night study.</p>
                    </div>
                    <label class="switch">
                        <input type="checkbox" id="dark-mode-toggle" onchange="toggleDarkMode()">
                        <span class="slider"></span>
                    </label>
                </div>
                <hr style="margin: 30px 0; border: 0; border-top: 1px solid var(--border-color); opacity: 0.2;">
                <button class="btn" style="background: var(--danger); box-shadow: 0 4px 15px rgba(239, 68, 68, 0.3);" onclick="clearAllData()">⚠️ Reset All Data</button>
            </div>
        </div>
    </div>

    <div id="todo-modal" class="modal-overlay">
        <div class="modal-glass" id="todo-window">
            <div class="modal-header draggable-handle" id="todo-header">
                <div>
                    <h2>New Task</h2>
                    <p style="color: var(--text-secondary); font-size: 0.9rem;">What's on your mind?</p>
                </div>
                <button class="close-icon" onclick="closeTodoModal()">✕</button>
            </div>
            
            <div class="modal-body">
                <div class="input-group">
                    <label>TASK NAME</label>
                    <input type="text" id="modal-todo-text" placeholder="e.g. Finish Math Homework" class="glass-input big-input">
                </div>

                <div class="row-group">
                    <div class="input-group">
                        <label>DUE DATE</label>
                        <input type="date" id="modal-todo-date" class="glass-input">
                    </div>
                    <div class="input-group">
                        <label>PRIORITY</label>
                        <select id="modal-todo-priority" class="glass-input">
                            <option value="low">🟢 Low</option>
                            <option value="medium" selected>🟡 Medium</option>
                            <option value="high">🔴 High</option>
                        </select>
                    </div>
                </div>

                <div class="input-group">
                    <label>DETAILS</label>
                    <textarea id="modal-todo-desc" placeholder="Add specific sub-tasks or links..." rows="3" class="glass-input"></textarea>
                </div>
            </div>

            <div class="modal-footer">
                <button class="btn-ghost" onclick="closeTodoModal()">Cancel</button>
                <button class="btn-primary-wide" onclick="saveTodoFromModal()">Create Task</button>
            </div>
        </div>
    </div>

    <div id="note-modal" class="modal-overlay">
        <div class="modal-glass modal-large" id="note-window">
            <div class="modal-header no-border draggable-handle" id="note-header">
                <input type="text" id="note-title" placeholder="Untitled Note" class="invisible-title">
                <button class="close-icon" onclick="closeNoteModal()">✕</button>
            </div>
            
            <div class="modal-body scrollable">
                <textarea id="note-content" placeholder="Start typing your brilliance here..." class="invisible-body"></textarea>
                
                <div id="image-preview-container" class="image-preview-box hidden">
                    <img id="image-preview" src="">
                    <button onclick="clearImage()" class="remove-img">✕</button>
                </div>
            </div>

            <div class="modal-footer toolbar">
                <div class="tools-left">
                     <label for="note-image" class="tool-btn" title="Add Image">
                        📷 <input type="file" id="note-image" accept="image/*" hidden onchange="previewImage(this)">
                    </label>
                    <input type="text" id="note-tags" placeholder="#tag1, #tag2" class="tag-input">
                </div>
                <button class="btn-primary-wide" onclick="saveNote()">Save</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
